<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말벌 신고</title>
<link rel="stylesheet" href="style.css?v=36">
</head>
<body>
<header class="top">
  <!-- 제목 왼쪽의 벌이 오른쪽 잠자리채로 날아가 잡혔다가 제자리로 돌아온다 (장식, 스크린리더 제외) -->
  <h1><span class="title-bee" aria-hidden="true"><span class="tb"><svg class="bee-body" viewBox="0 0 22 16" width="24" height="18">
      <ellipse class="wing" cx="9" cy="4" rx="4" ry="3.5" fill="#fff" fill-opacity=".9" stroke="#444" stroke-width=".6"/>
      <ellipse class="wing" cx="13" cy="4.5" rx="3.2" ry="3" fill="#fff" fill-opacity=".75" stroke="#444" stroke-width=".6"/>
      <path d="M2 10 L4.5 9 L4.5 11 Z" fill="#222"/>
      <ellipse cx="11" cy="10" rx="7" ry="4.6" fill="#f5c400" stroke="#222" stroke-width=".8"/>
      <rect x="8" y="5.6" width="1.8" height="8.8" fill="#222"/>
      <rect x="11.6" y="5.5" width="1.8" height="9" fill="#222"/>
      <circle cx="18.2" cy="9.4" r="2.6" fill="#222"/>
      <circle cx="19" cy="8.7" r=".7" fill="#fff"/>
    </svg></span></span> <span data-i18n="appName">말벌 위치 신고</span></h1>
  <div class="bee-scene" aria-hidden="true">
    <!-- 잠자리채: 빨간 손잡이는 왼쪽 아래, 빨간 고리 입구는 벌이 오는 왼쪽 위를 향하고,
         회색 그물 주머니는 휘두르는 방향의 반대(오른쪽 아래)로 끌린다 -->
    <svg class="net" viewBox="0 0 44 40" width="44" height="40">
      <!-- 손잡이 -->
      <line x1="3" y1="38" x2="9.5" y2="22.5" stroke="#222" stroke-width="3.8" stroke-linecap="round"/>
      <line x1="3" y1="38" x2="9.5" y2="22.5" stroke="#e53935" stroke-width="2.2" stroke-linecap="round"/>
      <!-- 그물 주머니 -->
      <path d="M20.5 3.5 Q36 5.5 40.5 19.5 Q42 27.5 34 27.5 Q20 26.5 9.5 22.5 Z" fill="rgba(215,215,215,.68)" stroke="#222" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M17 6 Q31 13 39.5 22.5 M12.5 15 Q25 22 37 26.5 M27 5 Q25.5 16 19 25.2 M33 8.5 Q31.5 19 27 26.6 M38 14 Q37 21.5 33.5 27.3" fill="none" stroke="#7a7a7a" stroke-width=".75"/>
      <!-- 고리 (입구): 안쪽 그물이 비쳐 보이게 -->
      <ellipse cx="15" cy="13" rx="5.6" ry="11" transform="rotate(30 15 13)" fill="rgba(225,225,225,.45)"/>
      <path d="M11 6 Q17 12 19.5 20.5 M14.5 4 Q18 11 20.5 16 M10 11.5 Q14 17 15.5 22.5" fill="none" stroke="#7a7a7a" stroke-width=".6"/>
      <ellipse cx="15" cy="13" rx="5.6" ry="11" transform="rotate(30 15 13)" fill="none" stroke="#222" stroke-width="3.4"/>
      <ellipse cx="15" cy="13" rx="5.6" ry="11" transform="rotate(30 15 13)" fill="none" stroke="#e53935" stroke-width="2"/>
    </svg>
  </div>
  <div class="hdr-right">
    <button type="button" id="btnInfo" class="pill-btn" data-i18n="infoBtn">벌 안전 가이드</button>
    <button type="button" id="btnHelp" class="icon-btn" data-i18n-aria="help" aria-label="사용 설명서">?</button>
    <button type="button" id="btnSettings" class="icon-btn" data-i18n-aria="settings" aria-label="설정">⚙</button>
  </div>
</header>

<main class="layout">
  <div id="map"><div class="map-msg" id="mapMsg" data-i18n="mapLoading">지도를 불러오는 중…</div></div>

  <section class="card form-card">
    <h2 data-i18n="reportTitle">신고하기</h2>
    <p class="hint" data-i18n="reportHint"></p>
    <div class="row">
      <button type="button" id="btnLocate" class="btn sub" data-i18n="useLocation"></button>
      <span id="posText" class="pos"></span>
    </div>

    <form id="form" novalidate>
      <div class="field">
        <span data-i18n="kindLegend"></span> <b class="req" data-i18n="required"></b> <small data-i18n="kindBothHint"></small>
        <div class="chips" id="chipsKind"></div>
      </div>

      <div class="field" id="grpSpecies">
        <span data-i18n="speciesLabel"></span> <small data-i18n="speciesHint"></small>
        <div class="chips" id="chipsSpecies"></div>
        <button type="button" id="seePhotos" class="btn link" data-i18n="seePhotos"></button>
      </div>
      <div class="field" id="grpCount" hidden>
        <span data-i18n="countLabel"></span> <small data-i18n="noteOpt"></small>
        <div class="chips" id="chipsCount"></div>
      </div>
      <div class="field" id="grpSize" hidden>
        <span data-i18n="sizeLabel"></span> <small data-i18n="noteOpt"></small>
        <div class="chips" id="chipsSize"></div>
      </div>

      <label class="field"><span data-i18n="noteLabel"></span> <small data-i18n="noteOpt"></small>
        <input type="text" id="note" maxlength="100" data-i18n-ph="notePh">
      </label>

      <label class="field"><span data-i18n="phoneLabel"></span> <b class="req" data-i18n="required"></b> <small data-i18n="phoneHint"></small>
        <input type="text" id="phone4" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required data-i18n-ph="phonePh">
      </label>

      <div class="field"><span data-i18n="photoLabel"></span> <small><span data-i18n="photoHint"></span> <span id="photoCount"></span></small>
        <div class="row">
          <label class="btn sub file"><span data-i18n="camera"></span><input type="file" id="photoCam" accept="image/*" capture="environment" hidden></label>
          <label class="btn sub file"><span data-i18n="gallery"></span><input type="file" id="photoGal" accept="image/*" multiple hidden></label>
        </div>
        <div id="previews" class="thumbs"></div>
      </div>

      <button type="submit" class="btn main" data-i18n="submit"></button>
    </form>
  </section>

  <section class="card list-card">
    <div class="stats" id="stats"></div>
    <h2><span data-i18n="listTitle"></span> <small id="count"></small></h2>
    <div class="datebar" id="datebar">
      <button type="button" id="dayPrev" class="nav" data-i18n-aria="prevDay">‹</button>
      <label class="daylabel"><span id="dayText"></span><input type="date" id="dayPick" data-i18n-aria="pickDate"></label>
      <button type="button" id="dayNext" class="nav" data-i18n-aria="nextDay">›</button>
      <span class="pills">
        <button type="button" id="dayToday" class="pill" data-day="today" data-i18n="today"></button>
        <button type="button" id="dayAll" class="pill" data-day="all" data-i18n="allShort"></button>
      </span>
    </div>
    <form class="searchbar" id="searchForm" novalidate>
      <div class="sb-input">
        <input type="text" id="phoneQ" inputmode="numeric" enterkeyhint="search" maxlength="4" autocomplete="off" data-i18n-ph="searchPh" data-i18n-aria="searchPh">
        <button type="button" id="phoneQClear" class="clear" data-i18n-aria="searchClear" hidden>×</button>
      </div>
      <button type="submit" class="btn main sb-go" data-i18n="searchBtn"></button>
    </form>
    <div id="list"></div>
    <nav id="pager" class="pager" data-i18n-aria="pagerLabel"></nav>
  </section>
</main>

<footer class="foot"><div class="visit" id="visit"></div></footer>

<!-- 휴대폰(좁은 화면) 전용 하단 탭: 신고하기 / 신고 목록 -->
<nav class="tabbar" id="tabbar">
  <button type="button" data-tab="report"><span class="ti">📝</span><span data-i18n="reportTitle"></span></button>
  <button type="button" data-tab="list"><span class="ti">📋</span><span data-i18n="listTitle"></span></button>
</nav>

<!-- 처리완료 입력 -->
<div id="doneDialogWrap" class="modal" hidden>
  <form id="doneForm" class="dialog">
    <h3 data-i18n="doneTitle"></h3>
    <label class="field"><span data-i18n="handlerLbl"></span> <b class="req" data-i18n="required"></b>
      <input type="text" id="handler" maxlength="40" required data-i18n-ph="handlerPh">
    </label>
    <p class="hint"><span data-i18n="doneTimeLbl"></span>: <span id="doneTime"></span></p>
    <div class="row">
      <button type="button" id="doneCancel" class="btn sub" data-i18n="cancel"></button>
      <button type="submit" class="btn main" data-i18n="doneSubmit"></button>
    </div>
  </form>
</div>

<!-- 안내/확인창 (브라우저 기본 창은 주소가 보여서 사용하지 않음) -->
<div id="msgWrap" class="modal" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-describedby="msgText">
    <p id="msgText" class="msg"></p>
    <div class="row">
      <button type="button" id="msgCancel" class="btn sub" data-i18n="cancel" hidden></button>
      <button type="button" id="msgOk" class="btn main" data-i18n="ok"></button>
    </div>
  </div>
</div>

<!-- 설정 -->
<div id="settingsWrap" class="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true">
    <h3>⚙ <span data-i18n="settings"></span></h3>
    <fieldset class="langset">
      <legend data-i18n="language"></legend>
      <label class="choice"><input type="radio" name="lang" value="ko"> 한국어</label>
      <label class="choice"><input type="radio" name="lang" value="en"> English</label>
    </fieldset>
    <fieldset class="langset">
      <legend data-i18n="mapSetting"></legend>
      <label class="choice"><input type="checkbox" id="optLabels"> <span data-i18n="optLabels"></span></label>
    </fieldset>
    <div class="row">
      <button type="button" id="openHelp" class="btn sub" data-i18n="help"></button>
      <button type="button" id="settingsClose" class="btn main" data-i18n="close"></button>
    </div>
  </div>
</div>

<!-- 사진 크게 보기 (새 창으로 이동하지 않아 지도 위치가 유지된다) -->
<div id="lightbox" class="modal lb" hidden>
  <button type="button" id="lbClose" class="lb-close" data-i18n-aria="close" aria-label="닫기">×</button>
  <img id="lbImg" alt="">
</div>

<!-- 벌 안전 가이드 (응급처치, 주요 말벌) -->
<div id="infoWrap" class="modal" hidden>
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <h3 id="infoTitle" data-i18n="infoTitle"></h3>
    <div id="infoBody" class="help-body"></div>
    <button type="button" id="infoClose" class="btn main" data-i18n="close"></button>
  </div>
</div>

<!-- 사용 설명서 -->
<div id="helpWrap" class="modal" hidden>
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <h3 id="helpTitle" data-i18n="helpTitle"></h3>
    <div id="helpBody" class="help-body"></div>
    <button type="button" id="helpClose" class="btn main" data-i18n="close"></button>
  </div>
</div>

<script src="config.js?v=36"></script>
<script src="i18n.js?v=36"></script>
<script src="app.js?v=36"></script>
</body>
</html>
